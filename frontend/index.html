<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DropOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #09090f;
  --s1:       #0f0f18;
  --s2:       #14141e;
  --s3:       #1a1a26;
  --s4:       #20202e;
  --b1:       #222234;
  --b2:       #2c2c42;
  --accent:   #7c6cfa;
  --ac-dim:   rgba(124,108,250,.13);
  --green:    #4ade80;
  --green-d:  rgba(74,222,128,.11);
  --red:      #f87171;
  --red-d:    rgba(248,113,113,.11);
  --amber:    #fbbf24;
  --amber-d:  rgba(251,191,36,.11);
  --blue:     #60a5fa;
  --t1:       #eeeef5;
  --t2:       #8888a8;
  --t3:       #52527a;
  --t4:       #33334d;
  --ff-d: 'Syne', sans-serif;
  --ff-b: 'DM Sans', sans-serif;
  --ff-m: 'DM Mono', monospace;
  --r:   8px;
  --r-lg: 12px;
}

body { background: var(--bg); color: var(--t1); font-family: var(--ff-b); font-size: 13px; line-height: 1.5; }
#app  { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
#sidebar {
  width: 216px;
  flex-shrink: 0;
  background: var(--s1);
  border-right: 1px solid var(--b1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-logo {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--b1);
}
.logo-mark { font-family: var(--ff-d); font-size: 16px; font-weight: 800; letter-spacing: -.4px; }
.logo-mark b { color: var(--accent); font-weight: 800; }
.logo-sub { font-size: 10px; color: var(--t3); font-family: var(--ff-m); margin-top: 2px; letter-spacing: .8px; text-transform: uppercase; }

.nav { padding: 10px 8px; flex: 1; overflow-y: auto; }
.nav-group-label {
  font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: 1px;
  font-family: var(--ff-m); padding: 10px 10px 4px; display: block;
}
.nav-group-label:first-child { padding-top: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border-radius: var(--r); cursor: pointer; color: var(--t2); font-size: 12.5px;
  font-weight: 400; transition: background .12s, color .12s; margin-bottom: 1px;
  border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--s2); color: var(--t1); }
.nav-item.active { background: var(--ac-dim); color: #c4b5ff; font-weight: 500; }
.nav-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: .55; }
.nav-item.active .nav-icon,
.nav-item:hover .nav-icon { opacity: .9; }
.nav-item .lbl { flex: 1; }
.nav-badge {
  font-size: 10px; font-family: var(--ff-m); background: var(--ac-dim);
  color: #a494f6; padding: 1px 6px; border-radius: 20px; font-weight: 600;
}
.nav-badge.g { background: var(--green-d); color: var(--green); }

.sidebar-footer { padding: 12px 14px; border-top: 1px solid var(--b1); }
.status-row { display: flex; align-items: center; gap: 7px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); flex-shrink: 0; transition: all .3s; }
.status-dot.on { background: var(--green); box-shadow: 0 0 7px var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
.status-txt { font-size: 11px; color: var(--t3); font-family: var(--ff-m); }

/* ── Layout shell ─────────────────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  height: 52px; padding: 0 24px; border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--s1); flex-shrink: 0; gap: 12px;
}
.page-title { font-family: var(--ff-d); font-size: 14px; font-weight: 700; color: var(--t1); letter-spacing: -.2px; }
.page-sub   { font-size: 11px; color: var(--t3); font-family: var(--ff-m); margin-left: 10px; }
#topbar-actions { display: flex; gap: 7px; align-items: center; }
#content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
  border-radius: var(--r); border: 1px solid var(--b2); background: var(--s2);
  color: var(--t2); font-size: 12px; font-family: var(--ff-b); cursor: pointer;
  transition: all .12s; font-weight: 500; white-space: nowrap; line-height: 1;
}
.btn:hover { background: var(--s3); color: var(--t1); border-color: var(--b2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #9487ff; border-color: #9487ff; color: #fff; }
.btn-green { background: var(--green-d); border-color: rgba(74,222,128,.25); color: var(--green); }
.btn-green:hover { background: rgba(74,222,128,.2); }
.btn-danger { background: var(--red-d); border-color: rgba(248,113,113,.25); color: var(--red); }
.btn-danger:hover { background: rgba(248,113,113,.2); }
.btn-amber { background: var(--amber-d); border-color: rgba(251,191,36,.25); color: var(--amber); }
.btn-amber:hover { background: rgba(251,191,36,.2); }
.btn-sm { padding: 5px 9px; font-size: 11px; }
.btn:disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px;
  font-size: 10px; font-family: var(--ff-m); font-weight: 600;
}
.badge-green  { background: var(--green-d); color: var(--green); border: 1px solid rgba(74,222,128,.2); }
.badge-amber  { background: var(--amber-d); color: var(--amber); border: 1px solid rgba(251,191,36,.2); }
.badge-red    { background: var(--red-d); color: var(--red); border: 1px solid rgba(248,113,113,.2); }
.badge-blue   { background: rgba(96,165,250,.1); color: var(--blue); border: 1px solid rgba(96,165,250,.2); }
.badge-purple { background: var(--ac-dim); color: #c4b5ff; border: 1px solid rgba(124,108,250,.2); }
.badge-gray   { background: rgba(80,80,100,.1); color: var(--t3); border: 1px solid rgba(80,80,100,.18); }

/* ── Cards ────────────────────────────────────────────────────────────────── */
.card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r-lg); padding: 20px 22px; }
.card-sm { background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); padding: 14px 16px; }
.card-title { font-family: var(--ff-d); font-size: 13px; font-weight: 700; margin-bottom: 14px; }

/* ── Dashboard funnel ─────────────────────────────────────────────────────── */
.funnel { display: grid; grid-template-columns: repeat(4,1fr); background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.funnel-stage { padding: 18px 20px; border-right: 1px solid var(--b1); }
.funnel-stage:last-child { border-right: none; }
.funnel-label { font-size: 10px; color: var(--t3); font-family: var(--ff-m); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 8px; }
.funnel-val { font-family: var(--ff-d); font-size: 30px; font-weight: 800; line-height: 1; }
.funnel-sub { font-size: 11px; color: var(--t3); font-family: var(--ff-m); margin-top: 5px; }

/* ── Stat row ─────────────────────────────────────────────────────────────── */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card {
  background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r);
  padding: 14px 16px; border-left-width: 3px;
}
.stat-card.blue   { border-left-color: var(--blue); }
.stat-card.green  { border-left-color: var(--green); }
.stat-card.amber  { border-left-color: var(--amber); }
.stat-card.purple { border-left-color: var(--accent); }
.stat-card.gray   { border-left-color: var(--t3); }
.stat-label { font-size: 10px; color: var(--t3); font-family: var(--ff-m); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 7px; }
.stat-val { font-family: var(--ff-d); font-size: 24px; font-weight: 800; line-height: 1; }
.stat-sub { font-size: 10px; color: var(--t3); font-family: var(--ff-m); margin-top: 4px; }

/* ── Product cards ────────────────────────────────────────────────────────── */
.queue-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 14px; }

.product-card {
  background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r-lg);
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.product-card:hover { border-color: var(--b2); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.product-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(124,108,250,.12); }

.pcard-img-wrap { position: relative; aspect-ratio: 4/5; background: var(--s3); overflow: hidden; flex-shrink: 0; }
.pcard-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.product-card:hover .pcard-img { transform: scale(1.04); }
.pcard-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--t4); font-size: 24px; }

.pcard-score {
  position: absolute; bottom: 9px; left: 9px;
  background: rgba(9,9,15,.84); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.09); border-radius: 7px;
  padding: 4px 9px; font-family: var(--ff-d); font-size: 13px; font-weight: 800; line-height: 1;
}
.pcard-score.hi { color: var(--green); } .pcard-score.mi { color: var(--amber); } .pcard-score.lo { color: var(--red); }

.pcard-check {
  position: absolute; top: 9px; right: 9px; width: 26px; height: 26px;
  border-radius: 7px; border: 1.5px solid rgba(255,255,255,.18);
  background: rgba(9,9,15,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .12s; color: #fff; font-size: 11px;
}
.product-card.selected .pcard-check { background: var(--accent); border-color: var(--accent); }
.pcard-check-mark { display: none; }
.product-card.selected .pcard-check-mark { display: block; }

.pcard-body { padding: 13px 13px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.pcard-name { font-family: var(--ff-d); font-size: 12.5px; font-weight: 700; color: var(--t1); line-height: 1.3; }
.pcard-cat { font-size: 10.5px; color: var(--t3); font-family: var(--ff-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pcard-pricing { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
.p-cost { font-family: var(--ff-m); font-size: 11px; color: var(--t2); }
.p-arr  { color: var(--t4); font-size: 10px; }
.p-sell { font-family: var(--ff-m); font-size: 11px; color: var(--green); font-weight: 500; }
.p-margin {
  margin-left: auto; font-size: 10px; font-family: var(--ff-m); color: var(--green);
  background: var(--green-d); border: 1px solid rgba(74,222,128,.2); padding: 1px 7px; border-radius: 20px;
}
.pcard-social { display: flex; gap: 8px; font-size: 10.5px; color: var(--t3); font-family: var(--ff-m); margin-top: 2px; }

.pcard-actions { padding: 9px 11px; border-top: 1px solid var(--b1); display: flex; gap: 6px; background: var(--s2); }
.pca-approve {
  flex: 1; padding: 7px 10px; background: var(--green-d); border: 1px solid rgba(74,222,128,.22);
  border-radius: var(--r); color: var(--green); font-size: 11.5px; font-family: var(--ff-b);
  font-weight: 600; cursor: pointer; transition: all .12s;
}
.pca-approve:hover { background: rgba(74,222,128,.2); }
.pca-post {
  flex: 1; padding: 7px 10px; background: var(--ac-dim); border: 1px solid rgba(124,108,250,.25);
  border-radius: var(--r); color: #c4b5ff; font-size: 11.5px; font-family: var(--ff-b);
  font-weight: 600; cursor: pointer; transition: all .12s;
}
.pca-post:hover { background: rgba(124,108,250,.22); }
.pca-reject {
  padding: 7px 10px; background: none; border: 1px solid var(--b2);
  border-radius: var(--r); color: var(--t3); font-size: 11.5px; cursor: pointer; transition: all .12s;
}
.pca-reject:hover { border-color: rgba(248,113,113,.4); color: var(--red); background: var(--red-d); }

/* ── Selection bar ────────────────────────────────────────────────────────── */
.selection-bar {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--s2); border: 1px solid var(--b2); border-radius: 40px;
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(124,108,250,.12);
  z-index: 50; animation: rise .2s ease;
}
@keyframes rise { from{transform:translateX(-50%) translateY(10px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }

/* ── Progress ─────────────────────────────────────────────────────────────── */
.progress-bar  { height: 3px; background: var(--s3); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }

/* ── Table ────────────────────────────────────────────────────────────────── */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; padding: 9px 16px; font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .8px; font-family: var(--ff-m); border-bottom: 1px solid var(--b1); }
.table td { padding: 13px 16px; border-bottom: 1px solid var(--b1); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(255,255,255,.013); }

/* ── Inputs ───────────────────────────────────────────────────────────────── */
input[type=text],input[type=number],input[type=password],select,textarea {
  background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r);
  color: var(--t1); font-family: var(--ff-b); font-size: 13px; padding: 9px 12px;
  outline: none; transition: border-color .12s, box-shadow .12s; width: 100%;
}
input:focus,select:focus,textarea:focus {
  border-color: rgba(124,108,250,.45);
  box-shadow: 0 0 0 3px rgba(124,108,250,.08);
}
select { cursor: pointer; }
label { display: block; font-size: 11px; color: var(--t3); font-family: var(--ff-m); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.form-group { margin-bottom: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

/* ── Detail panel ─────────────────────────────────────────────────────────── */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100;
  display: flex; align-items: flex-start; justify-content: flex-end;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.detail-panel {
  width: 460px; height: 100vh; background: var(--s1);
  border-left: 1px solid var(--b1); overflow-y: auto;
  display: flex; flex-direction: column; animation: slideIn .18s ease;
}
@keyframes slideIn { from{transform:translateX(28px);opacity:0} to{transform:none;opacity:1} }
.detail-hdr {
  padding: 16px 20px; border-bottom: 1px solid var(--b1);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--s1); z-index: 1; gap: 10px;
}
.detail-body { padding: 20px; flex: 1; }
.detail-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--r); background: var(--s2); margin-bottom: 16px; display: block; }
.detail-sec { margin-bottom: 18px; }
.detail-sec-lbl {
  font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .8px;
  font-family: var(--ff-m); margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--b1); display: block;
}
.m3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.mbox { background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); padding: 11px 13px; }
.mbox-lbl { font-size: 10px; color: var(--t3); font-family: var(--ff-m); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
.mbox-val { font-family: var(--ff-d); font-size: 18px; font-weight: 700; line-height: 1; }
.mbox-sub { font-size: 10px; color: var(--t3); font-family: var(--ff-m); margin-top: 3px; }

/* Score bars */
.sbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.sbar-lbl  { font-size: 11px; color: var(--t3); font-family: var(--ff-m); width: 72px; flex-shrink: 0; }
.sbar-track { flex: 1; height: 4px; background: var(--s3); border-radius: 2px; overflow: hidden; }
.sbar-fill  { height: 100%; border-radius: 2px; }
.sbar-num  { font-size: 11px; color: var(--t2); font-family: var(--ff-m); width: 22px; text-align: right; flex-shrink: 0; }

/* ── Modal ────────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.modal { background: var(--s1); border: 1px solid var(--b2); border-radius: var(--r-lg); padding: 24px; width: 400px; max-width: 100%; }
.modal-title { font-family: var(--ff-d); font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.modal-sub   { font-size: 12px; color: var(--t3); margin-bottom: 16px; line-height: 1.5; }
.reason-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

/* ── Scan ─────────────────────────────────────────────────────────────────── */
.keyword-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); font-size: 12px; font-family: var(--ff-m); color: var(--t2); }
.keyword-tag button { background: none; border: none; color: var(--t3); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; display: flex; align-items: center; }
.keyword-tag button:hover { color: var(--red); }
.pipeline-step { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--r); margin-bottom: 4px; }
.pipeline-step:hover { background: var(--s2); }
.step-num { width: 22px; height: 22px; border-radius: 6px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: var(--ff-m); color: var(--t3); flex-shrink: 0; }
.step-num.done { background: var(--green-d); color: var(--green); }
.step-num.active { background: var(--ac-dim); color: #c4b5ff; }
.mini-metric { background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); padding: 12px 14px; }
.mini-metric-label { font-size: 10px; color: var(--t3); font-family: var(--ff-m); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.mini-metric-val   { font-family: var(--ff-d); font-size: 20px; font-weight: 700; }

/* ── Job row ──────────────────────────────────────────────────────────────── */
.job-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--b1); }
.job-row:last-child { border-bottom: none; }
.job-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.job-dot.done { background: var(--green); }
.job-dot.queued { background: var(--t4); }
.job-dot.error  { background: var(--red); }
.job-dot.running,.job-dot.scraping,.job-dot.filtering,.job-dot.ai_review,.job-dot.calculating,.job-dot.deduping,.job-dot.saving { background: var(--amber); animation: blink 1.5s infinite; }

/* ── Empty states ─────────────────────────────────────────────────────────── */
.empty { text-align: center; padding: 60px 24px; }
.empty-icon { font-size: 32px; margin-bottom: 12px; display: block; opacity: .2; }
.empty h3 { font-family: var(--ff-d); font-size: 14px; font-weight: 700; color: var(--t2); margin-bottom: 5px; }
.empty p  { font-size: 12px; color: var(--t3); line-height: 1.6; }

/* ── Toast ────────────────────────────────────────────────────────────────── */
.toast { position: fixed; top: 20px; right: 20px; background: var(--s2); border: 1px solid var(--b2); border-radius: var(--r); padding: 11px 16px; font-size: 12.5px; z-index: 300; animation: fadeUp .18s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
.toast.success { border-color: rgba(74,222,128,.3); color: var(--green); }
.toast.error   { border-color: rgba(248,113,113,.3); color: var(--red); }
@keyframes fadeUp { from{transform:translateY(-6px);opacity:0} to{transform:none;opacity:1} }

/* ── Divider ──────────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--b1); margin: 16px 0; }

<script>
const API = 'http://localhost:8000/api';

// ── Icons (SVG strings) ────────────────────────────────────────────────────

  check: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

// ── State ──────────────────────────────────────────────────────────────────
let currentPage = 'dashboard';
let stats = {};
let selectedProducts = new Set();
let activeJobPoll = null;

let queueProducts = [], queueTotal = 0, queueSort = 'score';
let approvedProducts = [], approvedTotal = 0;
let rejectedProducts = [], rejectedTotal = 0;
let scanKeywords = ['aesthetic home decor', 'minimalist accessories', 'desk setup'];
let scanSource   = '1688';
let activeJob = null;
let settingsData = {};
let rejectTargetId = null;

// ── Nav ────────────────────────────────────────────────────────────────────
const NAV_PAGES = [
  { id:'dashboard', label:'Dashboard',    icon:'dashboard', section:'Overview' },
  { id:'scan',      label:'Scan',         icon:'scan'                          },
  { id:'queue',     label:'Review queue', icon:'queue',     section:'Pipeline', stageKey:'pending'  },
  { id:'approved',  label:'Approved',     icon:'approved',  stageKey:'approved' },
  { id:'posted',    label:'Posted',       icon:'posted'     },
  { id:'rejected',  label:'Rejected',     icon:'rejected'   },
  { id:'settings',  label:'Settings',     icon:'settings',  section:'Config'    },
];

function buildNav() {
  let html = '';
  let lastSection = null;
  for (const p of NAV_PAGES) {
    if (p.section && p.section !== lastSection) {
      html += `<span class="nav-group-label">${p.section}</span>`;
      lastSection = p.section;
    }
    const cnt = p.stageKey ? stats[p.stageKey] : null;
    const badgeClass = p.stageKey === 'approved' ? 'nav-badge g' : 'nav-badge';
    html += `
      <button class="nav-item${p.id === currentPage ? ' active' : ''}" onclick="navigate('${p.id}')">
        ${IC[p.icon]}
        <span class="lbl">${p.label}</span>
        ${cnt != null && cnt > 0 ? `<span class="${badgeClass}">${cnt}</span>` : ''}
      </button>`;
  }
  document.getElementById('nav').innerHTML = html;
}

function navigate(page) {
  currentPage = page;
  selectedProducts.clear();
  queueProducts = [];
  approvedProducts = [];
  buildNav();
  renderPage();
}

function setTitle(t, sub = '') {
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-sub').textContent = sub ? '· ' + sub : '';
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type = 'success', ms = 3200) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== null) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(API + path, opts);
    if (!r.ok) { const t = await r.text().catch(() => r.statusText); throw new Error(t || `HTTP ${r.status}`); }
    return r.json();
  } catch(e) { toast(e.message || 'API error', 'error'); throw e; }
}

function refreshStats() {
  return api('/stats').then(s => { stats = s; buildNav(); }).catch(() => {});
}

// ── Dashboard ──────────────────────────────────────────────────────────────

// ── Scan ───────────────────────────────────────────────────────────────────
async function renderScan() {
  setTitle('Scan');
  document.getElementById('topbar-actions').innerHTML = '';
  renderScanContent();
  if (activeJob && !activeJobPoll) activeJobPoll = setInterval(pollActiveJob, 2000);
}

function renderScanContent() {
  document.getElementById('content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div class="card" style="margin-bottom:14px">
          <div class="card-title">Search keywords</div>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">
            ${scanKeywords.map((kw, i) => `
              <div class="keyword-tag">${kw}
                <button onclick="removeKeyword(${i})">×</button>
              </div>`).join('')}
          </div>
          <div style="display:flex;gap:8px">
            <input type="text" id="kw-input" placeholder="Add keyword…" style="flex:1" onkeydown="if(event.key==='Enter')addKeyword()"/>
            <button class="btn btn-sm" onclick="addKeyword()">Add</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Scan settings</div>
          <div class="form-group">
            <label>Source platform</label>
            <select id="scan-source" onchange="scanSource=this.value">
              <option value="1688"   ${scanSource==='1688'   ? 'selected':''}>1688 — real sales data, ranked by orders</option>
              <option value="taobao" ${scanSource==='taobao' ? 'selected':''}>Taobao — broader catalog, no sales filter</option>
              <option value="both"   ${scanSource==='both'   ? 'selected':''}>Both — 1688 + Taobao combined</option>
            </select>
          </div>
          <div class="form-group">
            <label>Max products per keyword</label>
            <input type="number" id="max-per-kw" value="100" min="10" max="500"/>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="startScan()" ${activeJob ? 'disabled' : ''}>
            ${activeJob ? 'Scanning…' : 'Start scan'}
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="display:flex;align-items:center;gap:8px">
          Pipeline status
          ${activeJob ? `<span class="badge badge-amber">Running</span>` : ''}
        </div>
        ${activeJob ? renderJobProgress(activeJob) : `
          <div class="empty" style="padding:32px 0">
            <span class="empty-icon">○</span>
            <h3>No active scan</h3>
            <p>Start a scan to see pipeline progress</p>
          </div>`}
        <div style="margin-top:18px;border-top:1px solid var(--b1);padding-top:14px">
          <div style="font-size:10px;color:var(--t3);font-family:var(--ff-m);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px">Pipeline steps</div>
          ${[
            ['1','Scrape 1688 + Taobao → raw store'],
            ['2','Basic filter — spam, orders, rating'],
            ['3','Profit calc — margin threshold'],
            ['4','Deduplication — image hash'],
            ['5','Rule scoring → AI enrichment'],
            ['6','Save to review queue'],
          ].map(([n, label]) => {
            const prog = activeJob?.progress || 0;
            const thresholds = [0, 20, 40, 55, 60, 96, 100];
            const ni = parseInt(n);
            const isDone = prog >= thresholds[ni];
            const isActive = prog >= thresholds[ni - 1] && !isDone;
            return `
              <div class="pipeline-step">
                <div class="step-num ${isDone ? 'done' : isActive ? 'active' : ''}">${isDone ? '✓' : n}</div>
                <span style="font-size:12px;color:${isDone ? 'var(--green)' : isActive ? '#c4b5ff' : 'var(--t3)'}">${label}</span>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

function renderJobProgress(job) {
  const prog = job?.progress || 0;
  return `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px;color:var(--t2)">${job.status}</span>
        <span style="font-size:12px;font-family:var(--ff-m);color:var(--accent)">${prog}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[['Scraped',job.scraped??0],['After filter',job.after_basic??0],['Profitable',job.after_profit??0],['Deduped',job.after_dedup??0],['AI passed',job.after_ai??0]].map(([l,v]) =>
        `<div class="mini-metric"><div class="mini-metric-label">${l}</div><div class="mini-metric-val">${v}</div></div>`
      ).join('')}
    </div>`;
}

async function pollActiveJob() {
  if (!activeJob) { clearInterval(activeJobPoll); activeJobPoll = null; return; }
  try {
    const job = await api(`/jobs/${activeJob.id}`);
    activeJob = job;
    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    if (job.status === 'done') {
      clearInterval(activeJobPoll); activeJobPoll = null; activeJob = null;
      dot.className = 'status-dot'; lbl.textContent = 'Idle';
      toast(`Scan done · ${job.after_ai} products added to queue`, 'success');
      await refreshStats();
      if (currentPage === 'scan') renderScanContent();
    } else {
      dot.className = 'status-dot on'; lbl.textContent = job.status;
      if (currentPage === 'scan') renderScanContent();
    }
  } catch(e) {}
}

function addKeyword() {
  const inp = document.getElementById('kw-input');
  if (!inp?.value.trim()) return;
  scanKeywords.push(inp.value.trim()); inp.value = '';
  renderScanContent();
}
function removeKeyword(i) { scanKeywords.splice(i, 1); renderScanContent(); }

async function startScan() {
  if (!scanKeywords.length) { toast('Add at least one keyword', 'error'); return; }
  const max = parseInt(document.getElementById('max-per-kw')?.value || 100);
  const job = await api('/scan', 'POST', { keywords: scanKeywords, max_per_keyword: max, source: scanSource });
  activeJob = { id: job.job_id, status: 'queued', progress: 0 };
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  dot.className = 'status-dot on'; lbl.textContent = 'Scanning';
  if (activeJobPoll) clearInterval(activeJobPoll);
  activeJobPoll = setInterval(pollActiveJob, 2000);
  toast('Scan started', 'success');
  renderScanContent();
}

// ── Queue ──────────────────────────────────────────────────────────────────
async function renderQueue() {
  setTitle('Review queue');
  document.getElementById('topbar-actions').innerHTML = `
    <select onchange="queueSort=this.value;loadQueue()" style="width:auto;font-size:12px;padding:6px 10px">
      <option value="score"   ${queueSort==='score'  ?'selected':''}>Score ↓</option>
      <option value="margin"  ${queueSort==='margin' ?'selected':''}>Margin ↓</option>
      <option value="orders"  ${queueSort==='orders' ?'selected':''}>Orders ↓</option>
      <option value="created" ${queueSort==='created'?'selected':''}>Newest</option>
    </select>
    <button class="btn btn-sm" onclick="loadQueue()">↻</button>`;
  await loadQueue();
}

async function loadQueue(append = false) {
  const offset = append ? queueProducts.length : 0;
  if (!append) queueProducts = [];
  const data = await api(`/products?stage=pending&limit=50&offset=${offset}&sort=${queueSort}`).catch(() => ({ products: [], total: 0 }));
  queueProducts = append ? queueProducts.concat(data.products) : data.products;
  queueTotal = data.total;
  renderQueueGrid();
}

function renderQueueGrid() {
  if (!queueProducts.length) {
    document.getElementById('content').innerHTML = `
      <div class="empty" style="margin-top:48px">
        <span class="empty-icon">○</span>
        <h3>Queue is empty</h3>
        <p>Run a scan to find new products</p>
        <button class="btn" style="margin-top:16px" onclick="navigate('scan')">Start scan</button>
      </div>`;
    return;
  }
  const canMore = queueProducts.length < queueTotal;
  document.getElementById('content').innerHTML = `
    <div class="queue-toolbar">
      <span style="font-size:12px;color:var(--t3)">${queueTotal} products</span>
      <button class="btn btn-sm" onclick="selectAll()">Select all</button>
      <button class="btn btn-sm btn-green" onclick="selectAll();batchApprove()">Approve all</button>
      <button class="btn btn-sm btn-danger" onclick="selectAll();batchReject()">Reject all</button>
      <button class="btn btn-sm" onclick="clearSel()">Clear</button>
    </div>
    <div class="product-grid" id="product-grid">
      ${queueProducts.map(p => productCard(p, 'queue')).join('')}
    </div>
    ${canMore ? `<div style="text-align:center;margin-top:20px">
      <button class="btn" onclick="loadQueue(true)">Load more (${queueTotal - queueProducts.length} remaining)</button>
    </div>` : ''}`;
  updateSelBar();
}

// ── Approved ───────────────────────────────────────────────────────────────
async function renderApproved() {
  setTitle('Approved');
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-sm" onclick="loadApproved()">↻</button>`;
  await loadApproved();
}

async function loadApproved(append = false) {
  const offset = append ? approvedProducts.length : 0;
  if (!append) approvedProducts = [];
  const data = await api(`/products?stage=approved&limit=50&offset=${offset}&sort=score`).catch(() => ({ products: [], total: 0 }));
  approvedProducts = append ? approvedProducts.concat(data.products) : data.products;
  approvedTotal = data.total;
  renderApprovedGrid();
}

function renderApprovedGrid() {
  if (!approvedProducts.length) {
    document.getElementById('content').innerHTML = `
      <div class="empty" style="margin-top:48px">
        <span class="empty-icon">◆</span>
        <h3>Nothing approved yet</h3>
        <p>Approve products from the review queue</p>
        <button class="btn" style="margin-top:16px" onclick="navigate('queue')">Go to queue</button>
      </div>`;
    return;
  }
  const canMore = approvedProducts.length < approvedTotal;
  document.getElementById('content').innerHTML = `
    <div class="queue-toolbar">
      <span style="font-size:12px;color:var(--t3)">${approvedTotal} approved · select to batch post</span>
      <button class="btn btn-sm" onclick="selectAll()">Select all</button>
      <button class="btn btn-sm" onclick="clearSel()">Clear</button>
    </div>
    <div class="product-grid" id="product-grid">
      ${approvedProducts.map(p => productCard(p, 'approved')).join('')}
    </div>
    ${canMore ? `<div style="text-align:center;margin-top:20px">
      <button class="btn" onclick="loadApproved(true)">Load more (${approvedTotal - approvedProducts.length} remaining)</button>
    </div>` : ''}`;
  updateSelBar('post');
}

// ── Product card ───────────────────────────────────────────────────────────
function productCard(p, mode) {
  const sel = selectedProducts.has(p.id);
  const img = (p.images || [])[0] || '';
  const score = p.score || 0;
  const sc = score >= 8 ? 'hi' : score >= 7 ? 'mi' : 'lo';

  let actions = '';
  if (mode === 'queue') {
    actions = `<button class="pca-approve" onclick="event.stopPropagation();quickApprove(${p.id})">Approve</button>
               <button class="pca-reject"  onclick="event.stopPropagation();showRejectModal(${p.id})">✕</button>`;
  } else if (mode === 'approved') {
    actions = `<button class="pca-post"   onclick="event.stopPropagation();quickPost(${p.id})">Post →</button>
               <button class="pca-reject" onclick="event.stopPropagation();showRejectModal(${p.id})">✕</button>`;
  }

  const name = p.product_name || p.title_translated || p.title || 'Unknown';
  const cat  = [p.keyword ? `#${p.keyword}` : '', p.category].filter(Boolean).join(' · ');

  return `
    <div class="product-card${sel ? ' selected' : ''}" id="card-${p.id}" onclick="showDetail(${p.id})">
      <div class="pcard-img-wrap">
        ${img
          ? `<img class="pcard-img" src="${img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''}
        <div class="pcard-placeholder" style="${img ? 'display:none' : ''}">◈</div>
        <div class="pcard-score ${sc}">${score.toFixed(1)}</div>
        <div class="pcard-check" onclick="event.stopPropagation();toggleSel(${p.id})">
          <span class="pcard-check-mark">${IC.check}</span>
        </div>
      </div>
      <div class="pcard-body">
        <div class="pcard-name">${name}</div>
        <div class="pcard-cat">${cat || '—'}</div>
        <div class="pcard-pricing">
          <span class="p-cost">₾${p.cost_eur ?? '?'}</span>
          <span class="p-arr">→</span>
          <span class="p-sell">₾${p.sell_price_eur ?? '?'}</span>
          <span class="p-margin">${p.margin_pct ?? 0}%</span>
        </div>
        <div class="pcard-social">
          <span>★ ${p.rating ?? 0}</span>
          <span>${(p.orders ?? 0).toLocaleString()} sold</span>
        </div>
      </div>
      ${actions ? `<div class="pcard-actions">${actions}</div>` : ''}
    </div>`;
}

// ── Selection ──────────────────────────────────────────────────────────────
function toggleSel(id) {
  if (selectedProducts.has(id)) {
    selectedProducts.delete(id);
  } else {
    if (selectedProducts.size >= 10) { toast('Max 10 at once', 'error'); return; }
    selectedProducts.add(id);
  }
  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.className = `product-card${selectedProducts.has(id) ? ' selected' : ''}`;
  }
  updateSelBar(currentPage === 'approved' ? 'post' : 'approve');
}

function selectAll() {
  const list = currentPage === 'approved' ? approvedProducts : queueProducts;
  list.slice(0, 10).forEach(p => selectedProducts.add(p.id));
  if (currentPage === 'approved') renderApprovedGrid(); else renderQueueGrid();
}

function clearSel() {
  selectedProducts.clear();
  if (currentPage === 'approved') renderApprovedGrid(); else renderQueueGrid();
}

function updateSelBar(mode = 'approve') {
  let bar = document.getElementById('selection-bar');
  if (!selectedProducts.size) { bar?.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'selection-bar';
    bar.className = 'selection-bar';
    document.body.appendChild(bar);
  }
  const n = selectedProducts.size;
  let actions = '';
  if (mode === 'post') {
    actions = `<button class="btn btn-primary" onclick="batchPost()">Post ${n} →</button>`;
  } else {
    actions = `<button class="btn btn-green" onclick="batchApprove()">Approve ${n}</button>
               <button class="btn btn-danger" onclick="batchReject()">Reject ${n}</button>`;
  }
  bar.innerHTML = `
    <span style="font-family:var(--ff-m);font-size:12px;color:#c4b5ff">${n} selected</span>
    ${actions}
    <button class="btn" onclick="clearSel()">Cancel</button>`;
}

async function batchApprove() {
  const ids = [...selectedProducts];
  try {
    await api('/approve', 'POST', { product_ids: ids });
    toast(`${ids.length} approved`, 'success');
    selectedProducts.clear();
    await refreshStats();
    await loadQueue();
  } catch(e) {}
}

async function batchReject() {
  const ids = [...selectedProducts];
  try {
    await api('/reject', 'POST', { product_ids: ids });
    toast(`${ids.length} rejected`, 'success');
    selectedProducts.clear();
    queueProducts = queueProducts.filter(p => !ids.includes(p.id));
    queueTotal = Math.max(0, queueTotal - ids.length);
    await refreshStats();
    renderQueueGrid();
  } catch(e) {}
}

async function batchPost() {
  const ids = [...selectedProducts];
  try {
    await api('/post', 'POST', { product_ids: ids });
    toast(`${ids.length} queued for posting`, 'success');
    selectedProducts.clear();
    await refreshStats();
    await loadApproved();
  } catch(e) {}
}

async function quickApprove(id) {
  try {
    await api(`/products/${id}/approve`, 'POST');
    toast('Approved', 'success');
    closeDetail();
    queueProducts = queueProducts.filter(p => p.id !== id);
    selectedProducts.delete(id);
    queueTotal = Math.max(0, queueTotal - 1);
    renderQueueGrid();
    refreshStats();
  } catch(e) {}
}

async function quickPost(id) {
  try {
    await api(`/products/${id}/post`, 'POST');
    toast('Posted!', 'success');
    closeDetail();
    approvedProducts = approvedProducts.filter(p => p.id !== id);
    selectedProducts.delete(id);
    approvedTotal = Math.max(0, approvedTotal - 1);
    renderApprovedGrid();
    refreshStats();
  } catch(e) {}
}

// ── Reject modal ───────────────────────────────────────────────────────────
function showRejectModal(id) {
  rejectTargetId = id;
  document.getElementById('reject-modal')?.remove();
  const m = document.createElement('div');
  m.className = 'modal-overlay'; m.id = 'reject-modal';
  m.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Reject product</div>
      <div class="modal-sub">Pick a reason to track patterns over time</div>
      <div class="reason-pills">
        ${['Bad niche fit','Poor images','Oversaturated','Too expensive','Wrong category','Low quality'].map(r =>
          `<button class="btn btn-sm" onclick="setReason(this,'${r}')">${r}</button>`).join('')}
      </div>
      <div class="form-group">
        <label>Custom reason (optional)</label>
        <input type="text" id="reject-reason-input" placeholder="Type your own reason…"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-danger" style="flex:1" onclick="confirmReject()">Reject</button>
        <button class="btn" onclick="closeRejectModal()">Cancel</button>
      </div>
    </div>`;
  m.addEventListener('click', closeRejectModal);
  document.body.appendChild(m);
}

function setReason(btn, r) {
  document.getElementById('reject-reason-input').value = r;
  btn.closest('.reason-pills').querySelectorAll('.btn').forEach(b => { b.style.borderColor = ''; b.style.color = ''; });
  btn.style.borderColor = 'var(--red)'; btn.style.color = 'var(--red)';
}

function closeRejectModal() { document.getElementById('reject-modal')?.remove(); rejectTargetId = null; }

async function confirmReject() {
  if (!rejectTargetId) return;
  const id = rejectTargetId;
  const reason = document.getElementById('reject-reason-input')?.value?.trim() || '';
  closeRejectModal();
  try {
    await api(`/products/${id}/reject`, 'POST', { reason: reason || null });
    toast('Rejected', 'success');
    closeDetail();
    queueProducts = queueProducts.filter(p => p.id !== id);
    approvedProducts = approvedProducts.filter(p => p.id !== id);
    selectedProducts.delete(id);
    if (currentPage === 'queue') { queueTotal = Math.max(0, queueTotal - 1); renderQueueGrid(); }
    else if (currentPage === 'approved') { approvedTotal = Math.max(0, approvedTotal - 1); renderApprovedGrid(); }
    refreshStats();
  } catch(e) {}
}

    actionHtml = `<button class="btn btn-primary" style="flex:1" onclick="quickPost(${p.id})">Post to Instagram →</button>
                  <button class="btn btn-danger" onclick="showRejectModal(${p.id})">Reject</button>`;

    actionHtml = `<button class="btn btn-amber" style="flex:1" onclick="reconsider(${p.id})">Move back to queue</button>`;

  const ov = document.createElement('div');
  ov.className = 'detail-overlay'; ov.id = 'detail-overlay';
  ov.addEventListener('click', e => { if (e.target === ov) closeDetail(); });

  ov.innerHTML = `
    <div class="detail-panel">
      <div class="detail-hdr">

        ${p.keyword ? `<div style="font-size:11px;color:var(--t3);margin-bottom:14px">Keyword: <span style="color:var(--accent)">${p.keyword}</span></div>` : ''}

        <div class="detail-sec">

            </div>

        </div>

        <div class="detail-sec">
          <span class="detail-sec-lbl">Source performance
            ${p.source_platform ? `<span class="badge badge-gray" style="margin-left:6px;font-size:10px">${p.source_platform}</span>` : ''}
          </span>
          <div class="m3">

              <div class="mbox-val" style="font-size:16px;${(p.orders??0)>0?'color:var(--green)':''}">${(p.orders ?? 0).toLocaleString()}</div>

        <div class="detail-sec">

        ${p.caption ? `

function closeDetail() { document.getElementById('detail-overlay')?.remove(); }

async function saveNote(id) {
  const note = document.getElementById('review-note-input')?.value || '';
  try { await api(`/products/${id}/note`, 'PATCH', { note }); toast('Note saved', 'success'); } catch(e) {}
}

async function reconsider(id) {
  try {
    await api(`/products/${id}/reconsider`, 'POST');
    toast('Moved to review queue', 'success');
    closeDetail();
    rejectedProducts = rejectedProducts.filter(p => p.id !== id);
    renderRejectedTable();
    refreshStats();
  } catch(e) {}
}

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch(e) { return iso; }
}

          <input type="password" id="s-apify" value="${s.apify_token || ''}" placeholder="apify_api_…"/>
          <div style="font-size:11px;margin-top:5px;color:${s.apify_token ? 'var(--green)' : 'var(--t3)'}">
            ${s.apify_token ? '✓ Configured' : 'Not set — mock data will be used'}
          </div>
        </div>
        <div class="form-group">
          <label>Gemini key <span style="color:var(--green);font-weight:400">— recommended (cheapest + image analysis)</span></label>
          <input type="password" id="s-gemini" value="${s.gemini_key || ''}" placeholder="AIza…"/>
          <div style="font-size:11px;margin-top:5px;color:${s.gemini_key ? 'var(--green)' : 'var(--t3)'}">
            ${s.gemini_key ? '✓ Gemini 2.0 Flash active — image analysis enabled' : 'Not set — get free key at aistudio.google.com'}
          </div>
        </div>
        <div class="form-group">
          <label>Anthropic key <span style="color:var(--t3);font-weight:400">(fallback, text-only)</span></label>
          <input type="password" id="s-anthropic" value="${s.anthropic_key || ''}" placeholder="sk-ant-…"/>
          <div style="font-size:11px;margin-top:5px;color:${s.anthropic_key ? 'var(--green)' : 'var(--t3)'}">
            ${s.anthropic_key ? '✓ Claude Haiku fallback active' : 'Not set'}
          </div>
        </div>
        <div class="card-sm" style="margin-top:4px">
          <div style="font-size:11px;color:var(--t3);line-height:1.6">
            Priority: <b style="color:var(--t1)">Gemini</b> → Anthropic → mock rule-based.<br>
            Gemini analyses the actual product photo for visual appeal. ~$0.001/scan.
          </div>
        </div>
      </div>

      <div class="card" style="grid-column:1/-1">
        <div class="card-title">Scheduled scan keywords</div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:10px">Keywords used by the automatic 09:00 and 21:00 UTC scans. One per line.</div>
        <div class="form-group">
          <textarea id="s-scan-kw" rows="4" style="font-family:var(--ff-m);font-size:12px;resize:vertical">${(s.scan_keywords || []).join('\n')}</textarea>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="triggerScheduledScan()">Run scheduled scan now</button>
          <span id="sched-status" style="font-size:11px;color:var(--t3)">Loading scheduler…</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">CSSBuy scraper</div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:10px;line-height:1.6">
          Logs into cssbuy.com with Playwright and intercepts search results.
          Session is saved after first login — captcha rarely appears again.
        </div>
        <div class="form-group">
          <label>CSSBuy username / email</label>
          <input type="text" id="s-cssbuy-user" value="${s.cssbuy_username || ''}" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label>CSSBuy password</label>
          <input type="password" id="s-cssbuy-pass" value="${s.cssbuy_password || ''}"/>
        </div>
        <div class="form-group">
          <label>Source platform</label>
          <select id="s-cssbuy-source">
            <option value="1688"   ${String(s.cssbuy_source||'1688')==='1688'   ? 'selected':''}>1688 — real sales data, filtered &amp; ranked by orders</option>
            <option value="taobao" ${String(s.cssbuy_source||'')==='taobao' ? 'selected':''}>Taobao — broader catalog, no sales filter</option>
            <option value="both"   ${String(s.cssbuy_source||'')==='both'   ? 'selected':''}>Both — 1688 + Taobao combined</option>
          </select>
        </div>
        <div class="form-group">
          <label>2captcha API key <span style="color:var(--t3);font-weight:400">(optional — for auto captcha solve)</span></label>
          <input type="password" id="s-captcha-key" value="${s.captcha_2captcha_key || ''}" placeholder="2captcha key…"/>
          <div style="font-size:11px;margin-top:5px;color:var(--t3)">
            ${s.captcha_2captcha_key ? '✓ Auto captcha enabled' : 'Not set — browser opens visibly on first login so you can solve captcha manually'}
          </div>
        </div>
        <div class="card-sm" style="margin-top:4px">
          <div style="font-size:11px;color:var(--t3);line-height:1.6">
            First run: save settings, then start a scan — browser will open for manual captcha if no 2captcha key.
            After first login the session is saved and captcha won't appear again.
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Google Sheets export</div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:10px">Approved + posted products are synced here on each post action.</div>
        <div class="form-group">
          <label>Spreadsheet ID</label>
          <input type="text" id="s-sheets-id" value="${s.google_sheets_id || ''}" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"/>
          <div style="font-size:11px;color:var(--t3);margin-top:4px">Found in the sheet URL after /d/</div>
        </div>
        <div class="form-group">
          <label>Service account credentials path</label>
          <input type="text" id="s-sheets-creds" value="${s.google_sheets_credentials || ''}" placeholder="/path/to/service-account.json"/>
        </div>
        <button class="btn btn-sm" onclick="exportToSheets()">Export to Sheets now</button>
      </div>

    </div>`;
  setTimeout(loadSchedulerStatus, 150);
}

async function loadSchedulerStatus() {
  try {
    const st = await api('/scheduler/status');
    const el = document.getElementById('sched-status');
    if (!el) return;
    if (st.running && st.jobs?.length) {
      const next = st.jobs.map(j => {
        const d = j.next_run ? new Date(j.next_run) : null;
        return `${j.id}: ${d ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' UTC' : '—'}`;
      }).join(' · ');
      el.textContent = `Next: ${next}`;
    } else {
      el.textContent = 'Scheduler not running';
    }
  } catch(e) {
    const el = document.getElementById('sched-status');
    if (el) el.textContent = 'Backend offline';
  }
}

async function triggerScheduledScan() {
  try {
    const res = await api('/scheduler/trigger', 'POST', {});
    toast(`Scheduled scan started (job #${res.job_id})`, 'success');
  } catch(e) {
    toast('Failed to trigger scan', 'error');
  }
}

async function exportToSheets() {
  try {
    const res = await api('/sheets/export', 'POST', {});
    toast(`Exported ${res.exported} products to Sheets${res.mock ? ' (mock)' : ''}`, 'success');
  } catch(e) {
    toast('Sheets export failed', 'error');
  }
}

async function saveSettings() {
  const g = id => document.getElementById(id);
  const kwRaw = g('s-scan-kw')?.value || '';
  const scanKws = kwRaw.split('\n').map(s => s.trim()).filter(Boolean);
  const data = {
    niche:             g('s-niche')?.value,
    instagram_username:g('s-instagram')?.value,
    min_margin:    parseFloat(g('s-margin')?.value    || 60),
    min_score:     parseFloat(g('s-score')?.value     || 7),
    min_orders:    parseInt  (g('s-orders')?.value    || 100),
    min_rating:    parseFloat(g('s-rating')?.value    || 4.5),
    exchange_rate: parseFloat(g('s-exchange')?.value  || 0.353),
    sell_markup_low:  parseFloat(g('s-ml')?.value || 3.5),
    sell_markup_mid:  parseFloat(g('s-mm')?.value || 2.8),
    sell_markup_high: parseFloat(g('s-mh')?.value || 2.2),
    apify_token:    g('s-apify')?.value     || '',
    gemini_key:     g('s-gemini')?.value    || '',
    anthropic_key:  g('s-anthropic')?.value || '',
    scan_keywords:  scanKws,
    google_sheets_id:          g('s-sheets-id')?.value    || '',
    google_sheets_credentials: g('s-sheets-creds')?.value || '',
    cssbuy_username:      g('s-cssbuy-user')?.value    || '',
    cssbuy_password:      g('s-cssbuy-pass')?.value    || '',
    cssbuy_source:        g('s-cssbuy-source')?.value  || '1688',
    captcha_2captcha_key: g('s-captcha-key')?.value  || '',
  };
  await api('/settings', 'PATCH', data);
  toast('Settings saved', 'success');
  loadSchedulerStatus();
}

// ── Router ─────────────────────────────────────────────────────────────────
async function renderPage() {
  const map = {
    dashboard: renderDashboard,
    scan:      renderScan,
    queue:     renderQueue,
    approved:  renderApproved,
    posted:    renderPosted,
    rejected:  renderRejected,
    settings:  renderSettings,
  };
  const fn = map[currentPage];
  if (fn) await fn().catch(e => {
    document.getElementById('content').innerHTML =
      `<div style="color:var(--red);padding:20px;font-family:var(--ff-m);font-size:12px">Error: ${e.message}</div>`;
  });
}

// ── Boot ───────────────────────────────────────────────────────────────────
refreshStats().then(() => { buildNav(); renderPage(); });
setInterval(refreshStats, 20000);
api('/settings').then(s => { scanSource = String(s.cssbuy_source || '1688'); }).catch(() => {});
</script>
</body>
</html>
